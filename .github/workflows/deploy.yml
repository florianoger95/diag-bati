name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # image officielle Playwright : WebKit et ses dépendances déjà installés (plus de téléchargement fragile)
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires et tests WebKit (canvas, images, PDF)
        timeout-minutes: 5
        run: npm test
      - name: Build GitHub Pages (base /<dépôt>/)
        run: node scripts/build-pages.mjs ${{ github.event.repository.name }}
      - name: Tests E2E WebKit sur le build publié (mode avion, reprise)
        timeout-minutes: 6
        env:
          E2E_BASE: /${{ github.event.repository.name }}/
        run: npx playwright test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/diag-bati/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
