@if (updates.updateReady()) {
  <div class="update banner banner-info" role="status">
    <span>Une nouvelle version de l'app est prête.</span>
    <span class="spacer"></span>
    <button class="btn btn-primary btn-small" type="button" (click)="updates.apply()">Mettre à jour</button>
  </div>
}
@if (updates.broken()) {
  <div class="update banner banner-danger" role="alert">
    L'app hors ligne est endommagée : reconnectez l'iPad à Internet puis rouvrez-la. Vos données ne sont pas touchées.
  </div>
}
<header class="appbar">
  <a class="brand" routerLink="/" aria-label="Accueil — dossiers">
    <img class="appbar-logo" src="brand/monogramme-blanc.png" alt="3DE" />
    <span class="brand-text">
      <strong>Diag bâti</strong>
      <span class="appbar-meta">Diagnostic du bâti ancien</span>
    </span>
  </a>
  <span class="spacer"></span>
  <a class="appbar-tool" routerLink="/reglages" routerLinkActive #rla="routerLinkActive"
     [attr.aria-current]="rla.isActive ? 'page' : null"><app-icon name="gear" />Réglages</a>
</header>
<main>
  <router-outlet />
</main>
<app-dialog-host />
